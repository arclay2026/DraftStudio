<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free icons · Draft Studio</title>
  <meta name="description" content="100 free line icons. Recolour them and download as SVG or PNG.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Free icons · Draft Studio">
  <meta property="og:description" content="100 free line icons. Recolour them and download as SVG or PNG.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="icons" id="top">
  <div data-header></div>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <span class="eyebrow"><span class="dot"></span>Free icon set · SVG &amp; PNG</span>
        <h1>Icons, <span class="hl">any colour.</span></h1>
        <p>100 hand-drawn line icons on a 24px grid. Pick one, recolour it, and download it as SVG or PNG, or copy the code straight into your project.</p>
      </div>
    </section>

    <section style="padding-bottom:var(--section)">
      <div class="wrap">
        <div class="toolbar">
          <div class="tb-left">
            <label class="sel-wrap"><span class="sr-only">Icon group</span>
              <select class="select" data-groups data-label="Icon group"></select>
            </label>
          </div>
          <div class="tb-right">
            <span class="result-count" data-count></span>
            <label class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <span class="sr-only">Search icons</span>
              <input type="search" placeholder="Search icons" data-q autocomplete="off">
            </label>
          </div>
        </div>
        <div class="icons-layout">
          <div class="icon-grid" data-icons></div>
          <aside class="inspector" data-inspector aria-label="Selected icon"></aside>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
