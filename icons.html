<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free icons · Draft Studio</title>
  <meta name="description" content="100 free line icons. Recolour them and download as SVG or PNG.">
  <meta name="theme-color" content="#0c0c0b">
  <meta property="og:title" content="Free icons · Draft Studio">
  <meta property="og:description" content="100 free line icons. Recolour them and download as SVG or PNG.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("ds-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Geist:wght@400..700&family=Geist+Mono:wght@500..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="icons" id="top">
  <div data-header></div>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <span class="eyebrow"><span class="dot"></span>Free icon set · SVG &amp; PNG</span>
        <h1>Icons, <span class="hl">any colour.</span></h1>
        <p>100 hand-drawn line icons on a 24px grid. Pick one, recolour it, and download it as SVG or PNG, or copy the code straight into your project.</p>
      </div>
    </section>

    <section style="padding-bottom:var(--section)">
      <div class="wrap">
        <div class="toolbar">
          <div class="toolbar-row">
            <div class="filters" data-groups role="group" aria-label="Icon group"></div>
            <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
              <span class="result-count" data-count></span>
              <label class="field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <span class="sr-only">Search icons</span>
                <input type="search" placeholder="Search icons" data-q autocomplete="off">
              </label>
            </div>
          </div>
        </div>
        <div class="icons-layout">
          <div class="icon-grid" data-icons></div>
          <aside class="inspector" data-inspector aria-label="Selected icon"></aside>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
