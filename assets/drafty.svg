<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><!-- Drafty, the Drafty Labs assistant: a glossy marbled ball. The colours flow and he blinks. -->
  <defs><radialGradient id="d-shade" cx=".4" cy=".34" r=".68"><stop offset=".45" stop-color="#140828" stop-opacity="0"/><stop offset="1" stop-color="#140828" stop-opacity=".58"/></radialGradient><radialGradient id="d-light" cx=".3" cy=".24" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".6" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="d-rim" cx=".5" cy=".42" r=".6"><stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset=".95" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="d-rimfade" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><mask id="d-rm"><rect width="100" height="100" fill="url(#d-rimfade)"/></mask><clipPath id="d-clip"><circle cx="50" cy="50" r="49"/></clipPath><filter id="d-vein" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".028" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="58" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation=".7"/></filter>
    <style>.dr-eye{transform-box:fill-box;transform-origin:50% 50%;animation:dr-blink 5s infinite}@keyframes dr-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}.dr-marble{transform-box:view-box;transform-origin:50px 50px;animation:dr-marble 22s linear infinite}@keyframes dr-marble{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.dr-eye,.dr-marble{animation:none}}</style>
  </defs>
  <g clip-path="url(#d-clip)"><circle cx="50" cy="50" r="49" fill="#7a5cff"/><g filter="url(#d-vein)"><g class="dr-marble"><rect x="-40" y="-40" width="10.5" height="180" fill="#ff8a1a"/><rect x="-30" y="-40" width="10.5" height="180" fill="#ffd53d"/><rect x="-20" y="-40" width="10.5" height="180" fill="#1fc8e8"/><rect x="-10" y="-40" width="10.5" height="180" fill="#7a5cff"/><rect x="0" y="-40" width="10.5" height="180" fill="#ff3d8b"/><rect x="10" y="-40" width="10.5" height="180" fill="#ff8a1a"/><rect x="20" y="-40" width="10.5" height="180" fill="#ffd53d"/><rect x="30" y="-40" width="10.5" height="180" fill="#1fc8e8"/><rect x="40" y="-40" width="10.5" height="180" fill="#7a5cff"/><rect x="50" y="-40" width="10.5" height="180" fill="#ff3d8b"/><rect x="60" y="-40" width="10.5" height="180" fill="#ff8a1a"/><rect x="70" y="-40" width="10.5" height="180" fill="#ffd53d"/><rect x="80" y="-40" width="10.5" height="180" fill="#1fc8e8"/><rect x="90" y="-40" width="10.5" height="180" fill="#7a5cff"/><rect x="100" y="-40" width="10.5" height="180" fill="#ff3d8b"/><rect x="110" y="-40" width="10.5" height="180" fill="#ff8a1a"/><rect x="120" y="-40" width="10.5" height="180" fill="#ffd53d"/><rect x="130" y="-40" width="10.5" height="180" fill="#1fc8e8"/><rect x="140" y="-40" width="10.5" height="180" fill="#7a5cff"/></g></g></g><circle cx="50" cy="50" r="49" fill="url(#d-shade)"/><circle cx="50" cy="50" r="49" fill="url(#d-light)"/><circle cx="50" cy="50" r="49" fill="url(#d-rim)" mask="url(#d-rm)"/>
  <g transform="translate(-6 -7)"><rect class="dr-eye" x="35" y="33" width="10" height="24" rx="5" fill="#111114"/><rect class="dr-eye" x="55" y="33" width="10" height="24" rx="5" fill="#111114"/><circle cx="38.2" cy="37.4" r="1.7" fill="#fff" opacity=".9"/><circle cx="58.2" cy="37.4" r="1.7" fill="#fff" opacity=".9"/></g>
</svg>
