<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drafty Labs · site tour</title>
<!-- The Drafty Labs site tour: screen recordings of the real site (record.js → clips/) in a browser
     window, with a drawn cursor, zooms and chapter cards. Render with:
     node ../shared/render.js site-tour --audio site-tour/site-tour-narration.mp3 --sfx -->
<link rel="stylesheet" href="../shared/stage.css">
<style>
  #win { position: absolute; left: 160px; top: 62px; width: 1600px; height: 946px; border-radius: 22px; overflow: hidden;
    background: #16171b; border: 1.5px solid rgba(244, 243, 239, .16); box-shadow: 0 60px 140px rgba(0, 0, 0, .6), 0 0 0 1px rgba(0, 0, 0, .4); visibility: hidden; }
  #bar { position: absolute; left: 0; right: 0; top: 0; height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #1d1e23; border-bottom: 1px solid rgba(244, 243, 239, .08); }
  #bar i { width: 13px; height: 13px; border-radius: 50%; }
  #url { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); width: 520px; height: 28px; border-radius: 9px; background: rgba(244, 243, 239, .07);
    display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 15px/1 var(--sans); color: rgba(244, 243, 239, .72); letter-spacing: 0; }
  #view { position: absolute; left: 0; top: 46px; width: 1600px; height: 900px; overflow: hidden; background: #fff; }
  #cam { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
  #cam video { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; visibility: hidden; }
  #cur { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -3px 0 0 -4px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .35)); visibility: hidden; }
  .rip { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(31, 122, 255, .28); border: 2px solid rgba(31, 122, 255, .7); opacity: 0; }
  .chip2 { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 16px 28px; border-radius: 999px; background: rgba(17, 17, 20, .82);
    backdrop-filter: blur(16px); border: 1.5px solid rgba(244, 243, 239, .16); font: 600 30px/1 var(--sans); letter-spacing: -.02em; color: var(--cream); white-space: nowrap; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><i class="orb" id="o1"></i><i class="orb" id="o2"></i><i class="orb" id="o3"></i></div>
  <div id="scenes"></div>
  <div id="win"><div id="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    <div id="url"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="url-t">draftylabs.com</span></div></div>
    <div id="view"><div id="cam"></div></div></div>
  <div id="chips"></div>
  <div id="chrome"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="512" height="512"></canvas>
</div>
<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/SplitText.min.js"></script>
<script src="../shared/vendor/CustomEase.min.js"></script>
<script src="../shared/vendor/DrawSVGPlugin.min.js"></script>
<script src="../shared/logo.js"></script>
<script src="script.js"></script>
<script src="timing.js"></script>
<script src="clips/clips.js"></script>
<script src="../shared/engine.js"></script>
<script src="video.js"></script>
</body>
</html>
