<!-- The YouTube thumbnail for the Typography lesson (1280×720):

<style>
  @font-face { font-family: "Playfair Display"; font-weight: 700; src: url(fonts/playfair-display-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Bebas Neue"; src: url(fonts/bebas-neue-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0b0d; }
  #t { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b0b0d; color: #f4f3ef;

  .glow { position: absolute; border-radius: 50%; }

  .sub { position: absolute; left: 82px; top: 450px; font-size: 54px; font-weight: 600; letter-spacing: -.035em; line-height: 1.08; }
  .sub span { color: #1f7aff; }
  .aa { position: absolute; display: grid; place-items: center; width: 210px; height: 210px; border-radius: 44px; background: rgba(244, 243, 239, .06); border: 1.5px solid rgba(244, 243, 239, .14); font-size: 120px; line-height: 1; }
  .brand { position: absolute; left: 82px; bottom: 70px; }
  .vig { position: absolute; inset: 0; background: radial-gradient(120% 100% at 30% 50%, transparent 50%, rgba(0, 0, 0, .55)); }
</style>
</head>

<div id="t">
