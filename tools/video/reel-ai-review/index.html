<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Design Review · Ep. 1 · Bakery</title>
<!-- A 34-second vertical reel (1080×1920, 60 fps), made to carry a trending sound: no sound effects.
     Preview in a browser (space plays/pauses, arrows skip); render: node ../shared/render.js reel-ai-review out.mp4 -->
<style>
  @font-face { font-family: "Playfair"; src: url("../channel/fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  :root { --ink: #0a0a0c; --cream: #f4f3ef; --blue: #1f7aff; --red: #ff4d4d; --green: #3ddc84; --mute: rgba(244, 243, 239, .55);
    --sans: "Inter Display", "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  body { overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); color: var(--cream);
    font: 600 40px/1.15 var(--sans); letter-spacing: -.02em; transform-origin: 0 0; -webkit-font-smoothing: antialiased; }
  #cam { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; visibility: hidden; }
  .abs { position: absolute; }
  .orb { position: absolute; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%;
    background: radial-gradient(circle, var(--c) 0%, color-mix(in srgb, var(--c) 35%, transparent) 25%, transparent 62%); opacity: var(--o, .3); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 50%, rgba(0, 0, 0, .65)); }
  #grain { position: absolute; inset: -80px; width: calc(100% + 160px); height: calc(100% + 160px); opacity: .08; mix-blend-mode: overlay; pointer-events: none; }
  .kick { font: 600 24px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; }
  .big { font: 700 104px/1 var(--sans); letter-spacing: -.05em; }
  .cap { font: 700 64px/1.12 var(--sans); letter-spacing: -.035em; text-align: center; }
  .card { position: absolute; left: 110px; top: 440px; width: 860px; height: 860px; border-radius: 48px; overflow: hidden;
    box-shadow: 0 50px 100px -40px rgba(0, 0, 0, .9), 0 0 0 1.5px rgba(255, 255, 255, .08); will-change: transform; }
  .card > svg { display: block; width: 100%; height: 100%; }
  .zin { position: absolute; inset: 0; will-change: transform; }
  .zin > svg:first-child { display: block; width: 100%; height: 100%; }
  .stamp { position: absolute; left: 640px; top: 1150px; padding: 18px 34px 20px; border-radius: 26px; border: 6px solid currentColor;
    font: 800 96px/1 var(--sans); letter-spacing: -.04em; background: rgba(10, 10, 12, .92); transform: rotate(-11deg); }
  .stamp small { display: block; font: 700 22px/1 var(--mono); letter-spacing: .25em; margin-top: 8px; opacity: .9; }
  .note { position: absolute; overflow: visible; pointer-events: none; }
  .tile { position: absolute; width: 280px; height: 280px; border-radius: 36px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .9); }
  .tile > svg { width: 100%; height: 100%; display: block; }
  .tlabel { position: absolute; width: 280px; text-align: center; font: 600 30px/1 var(--sans); letter-spacing: -.02em; }
  .tlabel b { color: var(--green); margin-right: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 16px; padding: 26px 42px; border-radius: 999px; background: var(--blue); color: #fff;
    font: 700 46px/1 var(--sans); letter-spacing: -.02em; box-shadow: 0 24px 60px -18px rgba(31, 122, 255, .8); }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="bg"><i class="orb" id="o1"></i><i class="orb" id="o2"></i></div>
    <div id="scenes"></div>
  </div>
  <div id="vignette"></div>
  <canvas id="grain" width="400" height="400"></canvas>
</div>
<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/SplitText.min.js"></script>
<script src="../shared/vendor/CustomEase.min.js"></script>
<script src="../shared/vendor/DrawSVGPlugin.min.js"></script>
<script src="logo-parts.js"></script>
<script src="logos.js"></script>
<script src="review.js"></script>
</body>
</html>
