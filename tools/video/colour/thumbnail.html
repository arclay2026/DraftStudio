<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colour · thumbnail</title>
<!-- The YouTube thumbnail for the Colour lesson (1280×720). node render.js doesn't need it:
     node ../shared/render-thumbnail.js colour screenshots it to colour-thumbnail.png -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0b0d; }
  #t { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b0b0d; color: #f4f3ef;
    font-family: "Inter Display", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; border-radius: 50%; }
  .wheel { position: absolute; right: -120px; top: 50%; width: 760px; height: 760px; margin-top: -380px; border-radius: 50%;
    background: conic-gradient(hsl(0 88% 56%), hsl(30 88% 56%), hsl(60 88% 56%), hsl(90 88% 56%), hsl(120 88% 56%), hsl(150 88% 56%), hsl(180 88% 56%), hsl(210 88% 56%), hsl(240 88% 56%), hsl(270 88% 56%), hsl(300 88% 56%), hsl(330 88% 56%), hsl(360 88% 56%));
    -webkit-mask: radial-gradient(circle, transparent 205px, #000 206px); mask: radial-gradient(circle, transparent 205px, #000 206px); }
  .k { position: absolute; left: 80px; top: 96px; font: 600 22px/1 "DejaVu Sans Mono", monospace; letter-spacing: .3em; text-transform: uppercase; color: #1f7aff; }
  .big { position: absolute; left: 70px; top: 150px; font-weight: 700; font-size: 250px; line-height: 1; letter-spacing: -.065em;
    background: linear-gradient(90deg, #ff4d4d, #ff9f1a 30%, #ffd53d 55%, #3ddc84 80%, #22c1ee); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 30px; }
  .sub { position: absolute; left: 82px; top: 450px; font-size: 54px; font-weight: 600; letter-spacing: -.035em; line-height: 1.08; }
  .sub span { color: rgba(244, 243, 239, .55); }
  .brand { position: absolute; left: 82px; bottom: 70px; display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .vig { position: absolute; inset: 0; background: radial-gradient(120% 100% at 30% 50%, transparent 50%, rgba(0, 0, 0, .55)); }
</style>
</head>
<body>
<div id="t">
  <i class="glow" style="left:-200px;top:-260px;width:900px;height:900px;background:radial-gradient(circle, rgba(255,77,77,.22), transparent 60%)"></i>
  <i class="glow" style="left:700px;top:200px;width:900px;height:900px;background:radial-gradient(circle, rgba(31,122,255,.28), transparent 60%)"></i>
  <div class="wheel"></div>
  <div class="vig"></div>
  <div class="k">Design Basics · Lesson 01</div>
  <div class="big">Colour</div>
  <div class="sub">5 rules every<br>designer uses <span>→</span></div>
  <div class="brand" id="brand"></div>
</div>
<script src="../shared/logo.js"></script>
<script>document.getElementById("brand").innerHTML = LOGO.replace("<svg ", '<svg height="40" ');</script>
</body>
</html>
