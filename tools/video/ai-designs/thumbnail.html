<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI designs · cover</title>
<!-- The cover for the vertical video (1080×1920), inside the area social apps leave clear:
     node ../shared/render-thumbnail.js ai-designs -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0b0d; }
  #t { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0d; color: #f4f3ef; font-family: "Inter Display", "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; border-radius: 50%; }
  .card { position: absolute; top: 470px; width: 420px; height: 560px; border-radius: 40px; background: linear-gradient(145deg, rgba(244,243,239,.14), rgba(244,243,239,.04)); border: 2px solid rgba(244,243,239,.24);
    box-shadow: 0 40px 80px rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  .lab { font: 600 26px/1 "DejaVu Sans Mono", monospace; letter-spacing: .28em; }
  .h { position: absolute; left: 70px; right: 70px; top: 1110px; text-align: center; font: 700 92px/1.02 "Inter Display", sans-serif; letter-spacing: -.05em; }
  .h span { color: #ff6b6b; }
  .k { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font: 600 26px/1 "DejaVu Sans Mono", monospace; letter-spacing: .32em; color: #1f7aff; text-transform: uppercase; }
  .brand { position: absolute; left: 0; right: 0; top: 1420px; display: flex; justify-content: center; }
</style>
</head>
<body>
<div id="t">
  <i class="glow" style="left:-300px;top:200px;width:1200px;height:1200px;background:radial-gradient(circle, rgba(255,143,177,.24), transparent 60%)"></i>
  <i class="glow" style="left:300px;top:700px;width:1100px;height:1100px;background:radial-gradient(circle, rgba(31,122,255,.26), transparent 60%)"></i>
  <div class="k">Real life vs AI ads</div>
  <div class="card" style="left:80px;transform:rotate(-4deg)"><div class="lab" style="color:#3ddc84">ORDERED</div>
    <svg width="340" height="190" viewBox="0 0 420 230"><defs><linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2d8"/><stop offset="1" stop-color="#d77aa8"/></linearGradient></defs>
      <rect x="40" y="20" width="340" height="120" rx="46" fill="url(#sf)"/><rect x="10" y="80" width="80" height="120" rx="36" fill="url(#sf)"/><rect x="330" y="80" width="80" height="120" rx="36" fill="url(#sf)"/>
      <rect x="70" y="110" width="140" height="80" rx="30" fill="#ffd6e5"/><rect x="210" y="110" width="140" height="80" rx="30" fill="#ffd6e5"/><rect x="60" y="196" width="16" height="30" rx="6" fill="#8a5a44"/><rect x="344" y="196" width="16" height="30" rx="6" fill="#8a5a44"/></svg>
    <div style="font:700 40px/1 'Inter Display'">$299 · ★ 4.9</div></div>
  <div class="card" style="right:80px;transform:rotate(4deg)"><div class="lab" style="color:#ff6b6b">GOT</div>
    <svg width="220" height="110" viewBox="0 0 260 130"><path d="M20 60Q130 40 240 60V100Q130 120 20 100Z" fill="#8d8d93"/><path d="M30 40Q130 20 230 40V70Q130 52 30 70Z" fill="#a3a3a8"/><rect x="6" y="56" width="34" height="50" rx="14" fill="#7c7c82"/><rect x="220" y="56" width="34" height="50" rx="14" fill="#7c7c82"/></svg>
    <div style="font-size:96px;line-height:1">😐</div></div>
  <div class="h">The pictures<br><span>lied.</span></div>
  <div class="brand" id="brand"></div>
</div>
<script src="../shared/logo.js"></script>
