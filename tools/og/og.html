<!doctype html>
<!-- Source for assets/og.jpg, the 1200 × 630 picture shown when a Draft Studio link is shared.
     To change it, edit this file and screenshot it at 1200 × 630 (see tools/og/README.md). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; background: #f3f3f3; color: #0f0f0f; display: grid; grid-template-columns: 1fr 560px; gap: 0; }
  .copy { padding: 64px 0 60px 68px; display: flex; flex-direction: column; }
  .logo { height: 58px; width: auto; align-self: flex-start; }
  h1 { margin-top: auto; font-size: 64px; line-height: .98; letter-spacing: -.055em; font-weight: 650; }
  h1 span { color: #a3a3a3; }
  p { margin-top: 22px; font-size: 22px; color: #5f5f5f; letter-spacing: -.01em; }
  .pills { display: flex; gap: 10px; margin-top: 30px; }
  .pills b { padding: 10px 18px; border-radius: 999px; background: #fff; border: 1px solid #e4e4e4; font-size: 18px; font-weight: 550; }
  .pills b.blue { background: #1f7aff; border-color: #1f7aff; color: #fff; }
  .art { position: relative; }
  .art figure { position: absolute; overflow: hidden; border-radius: 28px; box-shadow: 0 40px 70px -34px rgba(0,0,0,.45); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .a1 { left: 40px; top: 46px; width: 330px; height: 430px; transform: rotate(-4deg); }
  .a2 { right: 34px; top: 120px; width: 250px; height: 330px; transform: rotate(5deg); }
  .a3 { left: 150px; bottom: -40px; width: 300px; height: 210px; background: #fff; transform: rotate(2deg); }
  .a3 img { object-fit: contain; padding: 22px; }
  .dot { position: absolute; right: 70px; bottom: 70px; display: grid; grid-template-columns: repeat(5, 16px); gap: 8px; }
  .dot i { width: 16px; height: 16px; border-radius: 50%; background: #dcdcdc; }
  .dot i.on { background: #1f7aff; box-shadow: 0 0 14px rgba(31,122,255,.6); }
</style></head>
<body>
  <div class="copy">
    <img class="logo" src="../../assets/logo.svg" alt="">
    <h1>Free design files,<br><span>ready to download.</span></h1>
    <p>Mockups, logos, icons, palettes and a QR code studio.</p>
    <div class="pills"><b class="blue">100% free</b><b>No sign-up</b><b>No watermark</b></div>
  </div>
  <div class="art">
    <figure class="a1"><img src="../../previews/hoodie-mockup-one.jpg" alt=""></figure>
    <figure class="a2"><img src="../../previews/t-shirt-mockup-one.jpg" alt=""></figure>
    <figure class="a3"><img src="../../previews/wiltz-logo.jpg" alt=""></figure>
  </div>
</body></html>
