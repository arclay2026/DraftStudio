<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse · Draft Studio</title>
  <meta name="description" content="Free PSD mockups, vectors, logos in AI and SVG, and design templates. No sign-up, no watermark.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Browse · Draft Studio">
  <meta property="og:description" content="Free PSD mockups, vectors, logos in AI and SVG, and design templates. No sign-up, no watermark.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="browse" id="top">
  <div data-header></div>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <span class="eyebrow"><span class="dot"></span>Browse the studio</span>
        <h1 data-title>Every <span class="hl">file.</span></h1>
        <p data-lede>Every mockup, vector, logo and template in the studio. Free to download, free to use.</p>
      </div>
    </section>

    <section style="padding-bottom:var(--section)">
      <div class="wrap">
        <div class="toolbar">
          <div class="toolbar-row">
            <div class="dd" data-cats>
              <div class="dd-btn">
                <span class="dd-ico" data-dd-ico></span>
                <span class="dd-txt"><small>Showing</small><b data-dd-label>All files</b></span>
                <span class="dd-n" data-dd-n></span>
                <button class="dd-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose a category" data-dd-btn>
                  <svg class="dd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
              </div>
              <div class="dd-menu" role="listbox" aria-label="Category" data-dd-menu></div>
            </div>
            <label class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <span class="sr-only">Search files</span>
              <input type="search" placeholder="Search files" data-q autocomplete="off">
            </label>
          </div>
          <div class="toolbar-row">
            <label class="sel-wrap"><span class="sr-only">Format</span>
              <select class="select" data-fmts data-label="Format">
                <option value="">All formats</option>
                <option value="PSD">PSD</option>
                <option value="AI">AI</option>
                <option value="SVG">SVG</option>
                <option value="EPS">EPS</option>
                <option value="PDF">PDF</option>
                <option value="PNG">PNG</option>
              </select>
            </label>
            <div style="display:flex;align-items:center;gap:14px">
              <span class="result-count" data-count></span>
              <label class="sel-wrap"><span class="sr-only">Sort</span>
                <select class="select" data-sort data-label="Sort by">
                  <option value="new">Newest first</option>
                  <option value="old">Oldest first</option>
                  <option value="az">A to Z</option>
                  <option value="free">Free only</option>
                </select>
              </label>
            </div>
          </div>
        </div>
        <div class="grid" data-results></div>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
