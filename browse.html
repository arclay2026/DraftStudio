<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse · Draft Studio</title>
  <meta name="description" content="Free PSD mockups, vectors, logos in AI and SVG, and design templates. No sign-up, no watermark.">
  <meta name="theme-color" content="#0c0c0b">
  <meta property="og:title" content="Browse · Draft Studio">
  <meta property="og:description" content="Free PSD mockups, vectors, logos in AI and SVG, and design templates. No sign-up, no watermark.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("ds-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Geist:wght@400..700&family=Geist+Mono:wght@500..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="browse" id="top">
  <div data-header></div>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <span class="eyebrow"><span class="dot"></span>Browse the studio</span>
        <h1 data-title>Every <span class="hl">file.</span></h1>
        <p data-lede>Every mockup, vector, logo and template in the studio. Free to download, free to use.</p>
      </div>
    </section>

    <section style="padding-bottom:var(--section)">
      <div class="wrap">
        <div class="toolbar">
          <div class="toolbar-row">
            <div class="filters" data-cats role="group" aria-label="Category"></div>
            <label class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <span class="sr-only">Search files</span>
              <input type="search" placeholder="Search files" data-q autocomplete="off">
            </label>
          </div>
          <div class="toolbar-row">
            <div class="filters" data-fmts role="group" aria-label="Format"></div>
            <div style="display:flex;align-items:center;gap:14px">
              <span class="result-count" data-count></span>
              <label><span class="sr-only">Sort</span>
                <select class="select" data-sort>
                  <option value="new">Newest first</option>
                  <option value="old">Oldest first</option>
                  <option value="az">A to Z</option>
                  <option value="free">Free only</option>
                </select>
              </label>
            </div>
          </div>
        </div>
        <div class="grid" data-results></div>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
